<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All Bags — Moon Blossom</title>
<meta name="description" content="Shop the full Moon Blossom collection of luxury handbags — totes, shoulder bags, clutches, crossbody and mini bags.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23D4AF37' d='M15.5 3.5C11 5 8.5 9 8.5 13.5C8.5 18 11 20.5 15.5 22C10 22.5 5 18 5 12.5C5 7 10 2.5 15.5 3.5Z'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D0D0D">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <div class="page-header">
    <svg class="crescent-bg" viewBox="0 0 100 100"><path fill="#D4AF37" d="M62 8C42 15 28 35 28 55C28 75 42 90 62 96C36 98 14 78 14 52C14 26 36 6 62 8Z"/></svg>
    <span class="eyebrow" data-i18n="nav.shop">Shop</span>
    <h1 data-i18n="shop.title">Shop All Bags</h1>
    <div class="breadcrumb"><a href="index.html" data-i18n="nav.home">Home</a> / <span data-i18n="nav.shop">Shop</span></div>
  </div>

  <section class="section" style="padding-top:64px;">
    <div class="container">
      <div class="shop-layout">
        <aside class="filters-panel" id="filtersPanel">
          <div class="filters-close">
            <strong data-i18n="shop.filterBy">Filter</strong>
            <button id="closeFiltersBtn" aria-label="Close"></button>
          </div>
          <div class="filter-block">
            <h4 data-i18n="shop.allCategories">All Categories</h4>
            <div id="categoryFilters"></div>
          </div>
          <div class="filter-block">
            <h4 data-i18n="shop.priceRange">Price Range</h4>
            <div class="price-inputs">
              <input type="number" id="priceMin" placeholder="Min">
              <span>—</span>
              <input type="number" id="priceMax" placeholder="Max">
            </div>
          </div>
          <button class="btn btn-outline btn-block" id="resetFiltersBtn" data-i18n="shop.resetFilters">Reset Filters</button>
        </aside>

        <div>
          <div class="shop-toolbar">
            <div class="shop-search">
              <input type="text" id="shopSearch" data-i18n-placeholder="nav.search" placeholder="Search bags...">
              <span id="searchIcon"></span>
            </div>
            <button class="filter-mobile-btn" id="openFiltersBtn"><span id="filterIcon"></span> <span data-i18n="shop.filterBy">Filter</span></button>
            <span class="results-count" id="resultsCount"></span>
            <select class="sort-select" id="sortSelect">
              <option value="newest" data-i18n="shop.sortNewest">Newest</option>
              <option value="price-low" data-i18n="shop.sortPriceLow">Price: Low to High</option>
              <option value="price-high" data-i18n="shop.sortPriceHigh">Price: High to Low</option>
              <option value="popular" data-i18n="shop.sortPopular">Most Popular</option>
            </select>
          </div>

          <div class="product-grid" id="shopGrid"></div>
          <div class="empty-state" id="shopEmpty" style="display:none;">
            <div id="emptyIcon"></div>
            <p data-i18n="shop.noResults">No bags match your filters.</p>
            <button class="btn btn-outline" id="emptyResetBtn" data-i18n="shop.resetFilters">Reset Filters</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/products.js"></script>
<script>
MB.init('shop').then(() => {
  document.getElementById('searchIcon').innerHTML = MB.svgIcon('search');
  document.getElementById('filterIcon').innerHTML = MB.svgIcon('bag');
  document.getElementById('emptyIcon').innerHTML = MB.svgIcon('search');
  document.getElementById('closeFiltersBtn').innerHTML = MB.svgIcon('close');

  MBProducts.renderShop();

  const panel = document.getElementById('filtersPanel');
  document.getElementById('openFiltersBtn').addEventListener('click', () => panel.classList.add('open'));
  document.getElementById('closeFiltersBtn').addEventListener('click', () => panel.classList.remove('open'));
  document.getElementById('emptyResetBtn').addEventListener('click', () => document.getElementById('resetFiltersBtn').click());

  document.addEventListener('mb:rerender', () => {
    document.getElementById('categoryFilters').dataset.built = '';
    MBProducts.renderShop();
  });
});
</script>
</body>
</html>
