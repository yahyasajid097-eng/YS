<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping Policy — Moon Blossom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23D4AF37' d='M15.5 3.5C11 5 8.5 9 8.5 13.5C8.5 18 11 20.5 15.5 22C10 22.5 5 18 5 12.5C5 7 10 2.5 15.5 3.5Z'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D0D0D">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shipping">
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <div class="page-header">
    <span class="eyebrow" data-i18n="footer.shipping">Shipping Policy</span>
    <h1 data-i18n="footer.shipping">Shipping Policy</h1>
    <div class="breadcrumb"><a href="index.html" data-i18n="nav.home">Home</a> / <span data-i18n="footer.shipping">Shipping</span></div>
  </div>
  <section class="section">
    <div class="container">
      <div class="policy-content" id="policyContent"></div>

      <div class="about-values mt-lg">
        <div class="value-card">
          <div class="feature-icon" id="sIcon1"></div>
          <h3 id="sT1"></h3>
          <p id="sP1"></p>
        </div>
        <div class="value-card">
          <div class="feature-icon" id="sIcon2"></div>
          <h3 id="sT2"></h3>
          <p id="sP2"></p>
        </div>
        <div class="value-card">
          <div class="feature-icon" id="sIcon3"></div>
          <h3 id="sT3"></h3>
          <p id="sP3"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script>
const CONTENT = {
  en: { updated: 'Last updated: July 2026',
    cards: [['24-Hour Delivery','Most orders across Morocco arrive within 24 hours of confirmation.'],
            ['WhatsApp Updates','We stay in touch with you on WhatsApp from order confirmation until your bag arrives.'],
            ['Delivery Included','Delivery is included in the listed price — no extra shipping fees at checkout.']],
    sections: [
    ['Delivery Time', 'Most orders are delivered within 24 hours of confirmation. Delivery to more remote areas outside major cities may take a little longer.'],
    ['Order Updates', 'We follow up with you directly on WhatsApp at every step — from confirming your order to letting you know when it\'s on its way and once it has arrived.'],
    ['Delivery Fee', 'Delivery is included in the price shown for each product — there are no additional shipping charges added at checkout.'],
    ['Contact Us', 'If you have any question about your delivery, message us anytime on WhatsApp and we\'ll get back to you promptly.']
  ]},
  fr: { updated: 'Dernière mise à jour : juillet 2026',
    cards: [['Livraison sous 24h','La plupart des commandes au Maroc arrivent dans les 24 heures suivant la confirmation.'],
            ['Suivi via WhatsApp','Nous restons en contact avec vous sur WhatsApp, de la confirmation jusqu\'à la réception de votre sac.'],
            ['Livraison Incluse','La livraison est incluse dans le prix affiché — aucun frais supplémentaire à la commande.']],
    sections: [
    ['Délai de Livraison', 'La plupart des commandes sont livrées dans les 24 heures suivant la confirmation. La livraison vers les zones plus éloignées des grandes villes peut prendre un peu plus de temps.'],
    ['Suivi de Commande', 'Nous vous tenons informée directement sur WhatsApp à chaque étape — de la confirmation de votre commande jusqu\'à sa livraison.'],
    ['Frais de Livraison', 'La livraison est incluse dans le prix affiché pour chaque produit — aucun frais supplémentaire n\'est ajouté lors de la commande.'],
    ['Nous Contacter', 'Pour toute question sur votre livraison, écrivez-nous à tout moment sur WhatsApp et nous vous répondrons rapidement.']
  ]},
  ar: { updated: 'آخر تحديث: يوليو 2026',
    cards: [['توصيل خلال 24 ساعة','تصل معظم الطلبات في المغرب خلال 24 ساعة من تأكيد الطلب.'],
            ['متابعة عبر واتساب','نبقى على تواصل معك عبر واتساب من لحظة تأكيد الطلب وحتى وصول حقيبتك.'],
            ['التوصيل مشمول','التوصيل مشمول ضمن السعر المعروض — بدون أي رسوم إضافية عند إتمام الطلب.']],
    sections: [
    ['وقت التوصيل', 'تصل معظم الطلبات خلال 24 ساعة من تأكيد الطلب. قد يستغرق التوصيل للمناطق الأبعد عن المدن الكبرى وقتاً أطول قليلاً.'],
    ['متابعة الطلب', 'نتواصل معك مباشرة عبر واتساب في كل خطوة — من تأكيد طلبك وحتى إعلامك بأنه في الطريق وعند وصوله.'],
    ['رسوم التوصيل', 'التوصيل مشمول ضمن السعر المعروض لكل منتج — بدون أي رسوم شحن إضافية تُضاف عند إتمام الطلب.'],
    ['تواصلي معنا', 'لأي استفسار حول توصيل طلبك، راسلينا في أي وقت عبر واتساب وسنرد عليك بأسرع وقت.']
  ]}
};

MB.init('shipping').then(() => {
  function render(){
    const c = CONTENT[MB.state.lang] || CONTENT.en;
    document.getElementById('policyContent').innerHTML =
      `<span class="updated-date">${c.updated}</span>` +
      c.sections.map(([h,p]) => `<h2>${h}</h2><p>${p}</p>`).join('');

    const icons = ['truck','pin','leaf'];
    c.cards.forEach((card, i) => {
      document.getElementById(`sIcon${i+1}`).innerHTML = MB.svgIcon(icons[i]);
      document.getElementById(`sT${i+1}`).textContent = card[0];
      document.getElementById(`sP${i+1}`).textContent = card[1];
    });
  }
  render();
  document.addEventListener('mb:rerender', render);
});
</script>
</body>
</html>
