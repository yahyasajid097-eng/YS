<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Return & Refund Policy — Moon Blossom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23D4AF37' d='M15.5 3.5C11 5 8.5 9 8.5 13.5C8.5 18 11 20.5 15.5 22C10 22.5 5 18 5 12.5C5 7 10 2.5 15.5 3.5Z'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D0D0D">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="returns">
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <div class="page-header">
    <span class="eyebrow" data-i18n="footer.returns">Return &amp; Refund Policy</span>
    <h1 data-i18n="footer.returns">Return &amp; Refund Policy</h1>
    <div class="breadcrumb"><a href="index.html" data-i18n="nav.home">Home</a> / <span data-i18n="footer.returns">Returns</span></div>
  </div>
  <section class="section">
    <div class="container">
      <div class="policy-content" id="policyContent"></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script>
const CONTENT = {
  en: { updated: 'Last updated: July 2026', sections: [
    ['Returns & Exchanges', 'If you\'d like to return or exchange an item, simply message us on WhatsApp with your order details and the reason for the return. We\'ll arrange the details directly with you — including pickup and any refund or exchange — as quickly as possible.'],
    ['Refunds', 'Since all orders are paid via Cash on Delivery, any agreed refund is arranged directly with you over WhatsApp, in the way that works best for you.'],
    ['Damaged or Incorrect Items', 'If you receive a damaged or incorrect item, message us on WhatsApp with photos as soon as possible, and we will arrange a replacement or refund with you directly.'],
    ['Questions', 'Any question about returns or exchanges — just reach out to us on WhatsApp any time, we\'re happy to help.']
  ]},
  fr: { updated: 'Dernière mise à jour : juillet 2026', sections: [
    ['Retours et Échanges', 'Pour retourner ou échanger un article, il vous suffit de nous écrire sur WhatsApp avec les détails de votre commande et la raison du retour. Nous organiserons les détails directement avec vous — y compris la collecte et tout remboursement ou échange — aussi rapidement que possible.'],
    ['Remboursements', 'Puisque toutes les commandes sont payées à la livraison, tout remboursement convenu est organisé directement avec vous sur WhatsApp, selon ce qui vous convient le mieux.'],
    ['Articles Endommagés ou Incorrects', 'Si vous recevez un article endommagé ou incorrect, écrivez-nous sur WhatsApp avec des photos dès que possible, et nous organiserons un remplacement ou un remboursement directement avec vous.'],
    ['Questions', 'Pour toute question sur les retours ou échanges, contactez-nous à tout moment sur WhatsApp, nous serons ravis de vous aider.']
  ]},
  ar: { updated: 'آخر تحديث: يوليو 2026', sections: [
    ['الإرجاع والاستبدال', 'إذا رغبتِ بإرجاع أو استبدال منتج، يكفي أن تراسلينا عبر واتساب مع تفاصيل طلبك وسبب الإرجاع. سنتفق معك مباشرة على كل التفاصيل — بما فيها الاستلام وأي استرداد أو استبدال — بأسرع وقت ممكن.'],
    ['استرداد الأموال', 'نظراً لأن جميع الطلبات تُدفع عند الاستلام، يتم الاتفاق على أي استرداد معك مباشرة عبر واتساب، بالطريقة التي تناسبك.'],
    ['المنتجات التالفة أو الخاطئة', 'إذا استلمتِ منتجاً تالفاً أو غير مطابق للطلب، راسلينا عبر واتساب مع صور بأسرع وقت ممكن، وسنتفق معك مباشرة على الاستبدال أو استرداد المبلغ.'],
    ['أي استفسار', 'لأي سؤال حول الإرجاع أو الاستبدال، تواصلي معنا في أي وقت عبر واتساب، يسعدنا مساعدتك.']
  ]}
};

MB.init('returns').then(() => {
  function render(){
    const c = CONTENT[MB.state.lang] || CONTENT.en;
    document.getElementById('policyContent').innerHTML =
      `<span class="updated-date">${c.updated}</span>` +
      c.sections.map(([h,p,list]) => `<h2>${h}</h2><p>${p}</p>${list ? '<ul>'+list.map(li=>`<li>${li}</li>`).join('')+'</ul>' : ''}`).join('');
  }
  render();
  document.addEventListener('mb:rerender', render);
});
</script>
</body>
</html>
